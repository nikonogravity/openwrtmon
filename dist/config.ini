[interfaces]
awg = awg
wan = wan

[settings]
; Interval in seconds between status checks
poll_interval = 10
; External IP check service (must return plain text IP)
ip_check_url = https://api.ipify.org
; Country lookup service
country_check_url = https://ipapi.co/{ip}/country_name/
